[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
ffi = false

[profile.ci]
fuzz = { runs = 2000 }
invariant = { runs = 1000 }

[profile.lite]
fuzz = { runs = 50 }
invariant = { runs = 10 }
# Speed up compilation and tests during development.
optimizer = false

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "params_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

# RPC endpoints — values loaded from .env
[rpc_endpoints]
bsc_testnet = "${RPC_URL_BSC_TESTNET}"
bsc_mainnet = "${RPC_URL_BSC_MAINNET}"
sepolia = "${RPC_URL_SEPOLIA}"
ethereum = "${RPC_URL_ETHEREUM}"
opbnb_testnet = "${RPC_URL_OPBNB_TESTNET}"
opbnb_mainnet = "${RPC_URL_OPBNB_MAINNET}"
arbitrum_sepolia = "${RPC_URL_ARBITRUM_SEPOLIA}"
arbitrum_one = "${RPC_URL_ARBITRUM_ONE}"
zksync_sepolia = "${RPC_URL_ZKSYNC_SEPOLIA}"
zksync_mainnet = "${RPC_URL_ZKSYNC_MAINNET}"
op_sepolia = "${RPC_URL_OP_SEPOLIA}"
op_mainnet = "${RPC_URL_OP_MAINNET}"
base_sepolia = "${RPC_URL_BASE_SEPOLIA}"
base_mainnet = "${RPC_URL_BASE_MAINNET}"
unichain_sepolia = "${RPC_URL_UNICHAIN_SEPOLIA}"
unichain_mainnet = "${RPC_URL_UNICHAIN_MAINNET}"

# Etherscan V2 verification — single API key + unified endpoint for all chains
[etherscan]
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 97 }
bsc_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 56 }
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 11155111 }
ethereum = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 1 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 421614 }
arbitrum_one = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 42161 }
op_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 11155420 }
op_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 10 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 84532 }
base_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 8453 }
opbnb_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 5611 }
opbnb_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 204 }
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 1301 }
unichain_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 130 }

