name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: yarn format:check

      - name: Lint Solidity
        run: yarn lint:sol

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

  export-deployments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.VENUS_TOOLS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Export deployment addresses from broadcast files
        run: yarn export-deployments

      - name: Format deployment files
        run: yarn prettier --write "deployments/*.json"

      - name: Check for new deployments
        id: check-deployments
        run: |
          if git diff --quiet deployments/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Foundry
        if: steps.check-deployments.outputs.changed == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        if: steps.check-deployments.outputs.changed == 'true'
        run: forge build

      - name: Export ABIs
        if: steps.check-deployments.outputs.changed == 'true'
        run: yarn export-abis

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: updating deployment files"
          file_pattern: "deployments/**"
