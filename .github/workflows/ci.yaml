name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: yarn format:check

      - name: Lint Solidity
        run: yarn lint:sol

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

  export-deployments:
    # Writes the exported deployment files back to the branch under test. Runs only for pull requests
    # opened from this repository and manual dispatches, and never holds VENUS_TOOLS_TOKEN: the push
    # uses the job's own GITHUB_TOKEN, scoped to this repository and this run, which cannot bypass
    # branch protection and grants nothing the PR author does not already have.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Keep credentials out of .git/config while PR-controlled code (yarn lifecycle scripts,
          # hardhat config) runs below.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Export deployment addresses from broadcast files
        run: yarn export-deployments

      - name: Check for new deployments
        id: check-deployments
        run: |
          if git diff --quiet deployments/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Foundry
        if: steps.check-deployments.outputs.changed == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        if: steps.check-deployments.outputs.changed == 'true'
        run: forge build

      - name: Export ABIs
        if: steps.check-deployments.outputs.changed == 'true'
        run: yarn export-abis

      - name: Format deployment files
        if: steps.check-deployments.outputs.changed == 'true'
        run: yarn prettier --write "deployments/**/*.json"

      - name: Commit exported deployment files
        # The token enters only this step. Hooks are disabled so nothing installed above runs here.
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add -A -- deployments/
          if git diff --cached --quiet; then
            echo "No deployment changes to commit"
            exit 0
          fi
          git -c core.hooksPath=/dev/null \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "feat: updating deployment files"
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
